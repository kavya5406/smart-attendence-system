# Lint gate for the Smart Attendance System.
#
# The selected rules are the "critical" set: syntax errors, undefined names
# and broken comparisons/logic. They catch the failures that actually break a
# build, without failing CI on line length or import ordering in existing code.
# Widen `select` gradually if the codebase is cleaned up first.
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "frontend",
    "mlruns",
    "models",
    "data",
    ".venv",
    "venv",
]

[lint]
select = ["E9", "F63", "F7", "F82"]
