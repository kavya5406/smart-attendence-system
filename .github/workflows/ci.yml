name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Build the frontend
        # The SPA tests assert the real behaviour of the served pages, so CI
        # builds the bundle the same way production does.
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          cd ..
      - name: Byte-compile the package
        run: python -m compileall -q src
      - name: Run the test suite
        run: python -m pytest tests/ -q --tb=short
      - name: Check that no face images or databases are tracked
        run: |
          if git ls-files | grep -Ei '(^|/)(data/raw|dataset)/|\.(db|sqlite3)$'; then
            echo "::error::Biometric data or a database is tracked in git"
            exit 1
          fi
          echo "no tracked biometric data or databases"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
